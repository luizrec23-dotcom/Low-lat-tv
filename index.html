<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LowLat Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
    font-family: Arial, Helvetica, sans-serif; color:#fff; }
  video { position:fixed; top:0; left:0; right:0; bottom:0; width:100%; height:100%;
    object-fit:contain; background:#000; }
  #setup { position:fixed; top:0; left:0; right:0; bottom:0; display:none;
    flex-direction:column; align-items:center; justify-content:center; background:#111; }
  #setup h1 { font-size:48px; margin:0 0 16px; }
  #setup p { font-size:26px; color:#bbb; margin:6px 0; text-align:center; }
  #ip { font-size:44px; padding:12px 20px; width:480px; text-align:center;
    border:3px solid #555; background:#222; color:#fff; margin-top:28px; }
  #go { font-size:38px; padding:12px 40px; margin-top:24px; border:3px solid #555;
    background:#2a6; color:#fff; }
  #ip:focus, #go:focus { border-color:#fff; outline:none; }
  #status { position:fixed; left:24px; bottom:24px; font-size:28px; padding:8px 16px;
    background:rgba(0,0,0,.65); border-radius:8px; display:none; }
  #stats { position:fixed; right:24px; top:24px; font-size:26px; line-height:1.4;
    padding:12px 18px; background:rgba(0,0,0,.7); border-radius:8px; display:none;
    font-family: monospace; white-space:pre; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>

<div id="setup">
  <h1>LowLat Mirror</h1>
  <p>Digite o IP do celular (aparece no app) e confirme.</p>
  <p id="rtc"></p>
  <input id="ip" type="text" placeholder="192.168.0.10" inputmode="decimal">
  <button id="go">Conectar</button>
  <p style="font-size:22px;margin-top:30px">Amarelo: estatisticas &nbsp;|&nbsp; Azul: trocar IP &nbsp;|&nbsp; Voltar: sair</p>
</div>
<div id="status"></div>
<div id="stats"></div>

<script>
(function () {
  var PORT = 8080;
  var v = document.getElementById('v');
  var setupEl = document.getElementById('setup');
  var ipEl = document.getElementById('ip');
  var statusEl = document.getElementById('status');
  var statsEl = document.getElementById('stats');

  var ws = null, pc = null, dc = null, retryT = null, statusT = null;
  var host = '';
  try { host = localStorage.getItem('phoneHost') || ''; } catch (e) {}
  var statsOn = false, last = { t: 0, frames: 0, bytes: 0 }, view = { fps: 0, kbps: 0, lost: 0, rtt: -1, jit: -1 };

  function setStatus(msg, keep) {
    statusEl.textContent = msg; statusEl.style.display = 'block';
    clearTimeout(statusT);
    if (!keep) statusT = setTimeout(function () { statusEl.style.display = 'none'; }, 4000);
  }
  function showSetup() {
    document.getElementById('rtc').textContent =
      (window.RTCPeerConnection ? 'WebRTC: OK neste navegador' : 'WebRTC: NAO suportado aqui');
    ipEl.value = host; setupEl.style.display = 'flex'; ipEl.focus();
  }
  function hideSetup() { setupEl.style.display = 'none'; }

  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  function closePc() {
    if (dc) { try { dc.close(); } catch (e) {} dc = null; }
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    v.srcObject = null;
  }
  function retry() {
    clearTimeout(retryT);
    if (!host) return;
    retryT = setTimeout(connect, 2000);
  }

  function newPc() {
    closePc();
    pc = new RTCPeerConnection({ iceServers: [] });   // rede local: so candidatos "host"
    pc.onicecandidate = function (e) { if (e.candidate) send({ type: 'ice', candidate: e.candidate }); };
    pc.ontrack = function (e) {
      v.srcObject = e.streams[0];
      try { e.receiver.playoutDelayHint = 0; } catch (x) {}
      try { e.receiver.jitterBufferTarget = 0; } catch (x) {}
      try { v.play(); } catch (x) {}
    };
    pc.ondatachannel = function (e) {          // canal "ping": devolve o que receber
      dc = e.channel;
      dc.onmessage = function (m) { try { dc.send(m.data); } catch (x) {} };
    };
    pc.oniceconnectionstatechange = function () {
      var s = pc ? pc.iceConnectionState : '';
      if (s === 'connected' || s === 'completed') setStatus('Conectado');
      else if (s === 'failed' || s === 'disconnected') setStatus('Conexao perdida, aguardando...', true);
    };
  }

  function handle(m) {
    if (m.type === 'offer') {
      newPc();
      pc.setRemoteDescription({ type: 'offer', sdp: m.sdp })
        .then(function () { return pc.createAnswer(); })
        .then(function (a) { return pc.setLocalDescription(a).then(function () { send({ type: 'answer', sdp: a.sdp }); }); })
        .catch(function (e) { setStatus('Erro WebRTC: ' + e, true); });
    } else if (m.type === 'ice' && pc && m.candidate) {
      pc.addIceCandidate(new RTCIceCandidate(m.candidate)).catch(function () {});
    }
  }

  function connect() {
    clearTimeout(retryT);
    if (!host) { showSetup(); return; }
    if (!window.RTCPeerConnection) { showSetup(); return; }
    setStatus('Conectando a ' + host + '...', true);
    try { ws = new WebSocket('ws://' + host + ':' + PORT); } catch (e) { retry(); return; }
    ws.onopen = function () { hideSetup(); setStatus('Aguardando o celular...', true); send({ type: 'hello' }); };
    ws.onmessage = function (ev) { try { handle(JSON.parse(ev.data)); } catch (e) {} };
    ws.onclose = function () { closePc(); setStatus('Sem conexao com o celular (' + host + ')', true); retry(); };
    ws.onerror = function () {};
  }

  // ---- estatisticas ----
  setInterval(function () {
    if (!pc || !statsOn) return;
    pc.getStats().then(function (rep) {
      rep.forEach(function (r) {
        if (r.type === 'inbound-rtp' && (r.kind === 'video' || r.mediaType === 'video')) {
          var now = r.timestamp, df = r.framesDecoded || 0, by = r.bytesReceived || 0;
          if (last.t) {
            var dt = (now - last.t) / 1000;
            if (dt > 0) { view.fps = Math.round((df - last.frames) / dt); view.kbps = Math.round((by - last.bytes) * 8 / dt / 1000); }
          }
          last = { t: now, frames: df, bytes: by };
          view.lost = r.packetsLost || 0;
          if (r.jitterBufferDelay && r.jitterBufferEmittedCount)
            view.jit = Math.round(r.jitterBufferDelay / r.jitterBufferEmittedCount * 1000);
          else if (typeof r.jitter === 'number') view.jit = Math.round(r.jitter * 1000);
        }
        if (r.type === 'candidate-pair' && r.nominated && typeof r.currentRoundTripTime === 'number')
          view.rtt = Math.round(r.currentRoundTripTime * 1000);
      });
      statsEl.textContent =
        'fps: ' + view.fps + '\n' + 'taxa: ' + (view.kbps / 1000).toFixed(1) + ' Mbps\n' +
        'perdidos: ' + view.lost + '\n' + 'rede (RTT): ' + (view.rtt >= 0 ? view.rtt + ' ms' : '-') + '\n' +
        'buffer/jitter: ' + (view.jit >= 0 ? view.jit + ' ms' : '-');
    });
  }, 1000);

  // ---- controle remoto ----
  document.getElementById('go').addEventListener('click', function () {
    host = ipEl.value.trim();
    if (!host) return;
    try { localStorage.setItem('phoneHost', host); } catch (e) {}
    if (ws) { try { ws.close(); } catch (e) {} }
    connect();
  });
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (k === 10009) { try { tizen.application.getCurrentApplication().exit(); } catch (x) { history.back(); } }
    else if (k === 405 || k === 73) { statsOn = !statsOn; statsEl.style.display = statsOn ? 'block' : 'none'; last.t = 0; }
    else if (k === 406 || k === 66) { clearTimeout(retryT); if (ws) { try { ws.close(); } catch (x) {} } showSetup(); }
  });
  try { tizen.tvinputdevice.registerKey('ColorF2Yellow'); tizen.tvinputdevice.registerKey('ColorF3Blue'); } catch (e) {}

  connect();
})();
</script>
</body>
</html>
